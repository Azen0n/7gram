[project]
name = "sevengram"
description = "A Telegram bot that allows you to import emojis from 7tv to Telegram"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "python-telegram-bot==22.5",
    "SQLAlchemy[asyncio]==2.0.45",
    "pydantic-settings==2.12.0",
]

[dependency-groups]
lint = [
    "ruff",
]
dev = [
    {include-group = "lint"},
]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
]

[tool.ruff.format]
quote-style = "single"
